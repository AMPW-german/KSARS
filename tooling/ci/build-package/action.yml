name: Build and Package KSA Mod
description: Restores, builds, tests, and packages a KSA mod using KSAModTools and a KSA DLL snapshot repository.

inputs:
  csproj_path:
    description: Relative path to the mod .csproj file (e.g. KSAGEffects/KSAGEffects.csproj).
    required: true
  artifact_prefix:
    description: Optional artifact filename prefix (defaults to the .csproj filename stem).
    required: false
    default: ''
  configuration:
    description: MSBuild configuration (defaults to Debug on pull_request, Release otherwise).
    required: false
    default: ''
  include_starmap:
    description: Whether to download StarMap.API.dll from StarMapLoader/StarMap latest release.
    required: false
    default: 'true'
  mod_deps:
    description: Optional JSON array of GitHub release mod dependencies to download into deps/.
    required: false
    default: ''
  project_ref_replacements:
    description: Optional JSON array mapping local ProjectReference paths to CI Reference/HintPath entries.
    required: false
    default: ''
  test_command:
    description: Optional shell command to run tests after building (executed with KSADir and KSAModsDir exported).
    required: false
    default: ''
  ksa_dll_repo:
    description: Private KSA DLL snapshot repository in owner/repo format (falls back to env.KSA_DLL_REPO).
    required: false
    default: ''
  ksa_dll_token:
    description: Pre-minted token with read access to ksa_dll_repo (falls back to env.KSA_DLL_TOKEN).
    required: false
    default: ''
  ksa_dll_app_id:
    description: GitHub App ID used to mint a read token for ksa_dll_repo (falls back to env.KSA_DLL_APP_ID).
    required: false
    default: ''
  ksa_dll_app_private_key:
    description: GitHub App private key used to mint a read token for ksa_dll_repo (falls back to env.KSA_DLL_APP_PRIVATE_KEY).
    required: false
    default: ''
  github_token:
    description: GitHub token for release queries and dependency downloads.
    required: false
    default: ${{ github.token }}

outputs:
  mod_name:
    description: Resolved MSBuild ModName property.
    value: ${{ steps.metadata.outputs.mod_name }}
  assembly_name:
    description: Resolved MSBuild AssemblyName property.
    value: ${{ steps.metadata.outputs.assembly_name }}
  version:
    description: Resolved mod version prefixed with 'v' (e.g. v0.3.3).
    value: ${{ steps.metadata.outputs.version }}
  ksa_version:
    description: KSA game version from ksa-versions.csv.
    value: ${{ steps.ksa-version.outputs.version }}
  artifact_name:
    description: Uploaded artifact name.
    value: ${{ steps.artifact-name.outputs.name }}
  release_needed:
    description: Whether a new GitHub/SpaceDock release should be published ('true' or 'false').
    value: ${{ steps.release-check.outputs.release_needed }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Resolve build configuration and validate KSA DLL repository
      id: ksa-repo
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.configuration }}
        INPUT_KSA_DLL_REPO: ${{ inputs.ksa_dll_repo }}
      run: |
        if [ -n "$INPUT_CONFIG" ]; then
          config="$INPUT_CONFIG"
        elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          config="Debug"
        else
          config="Release"
        fi
        echo "configuration=$config" >> "$GITHUB_OUTPUT"

        ksa_repo="${INPUT_KSA_DLL_REPO:-${KSA_DLL_REPO:-}}"
        if [ -z "$ksa_repo" ]; then
          echo "Missing KSA DLL repository (set KSA_DLL_REPO in workflow env or pass ksa_dll_repo input; expected format: owner/repo)." >&2
          exit 1
        fi
        owner="${ksa_repo%%/*}"
        repo="${ksa_repo##*/}"
        if [ -z "$owner" ] || [ -z "$repo" ] || [ "$owner" = "$repo" ]; then
          echo "Invalid KSA_DLL_REPO value: ${ksa_repo}. Expected owner/repo." >&2
          exit 1
        fi
        echo "repository=$ksa_repo" >> "$GITHUB_OUTPUT"
        echo "owner=$owner" >> "$GITHUB_OUTPUT"
        echo "repo=$repo" >> "$GITHUB_OUTPUT"

    - name: Mint GitHub App token for KSA DLL repo
      id: app-token
      if: ${{ (inputs.ksa_dll_token == '' && env.KSA_DLL_TOKEN == '') && (inputs.ksa_dll_app_id != '' || env.KSA_DLL_APP_ID != '') }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.ksa_dll_app_id != '' && inputs.ksa_dll_app_id || env.KSA_DLL_APP_ID }}
        private-key: ${{ inputs.ksa_dll_app_private_key != '' && inputs.ksa_dll_app_private_key || env.KSA_DLL_APP_PRIVATE_KEY }}
        owner: ${{ steps.ksa-repo.outputs.owner }}
        repositories: ${{ steps.ksa-repo.outputs.repo }}

    - name: Clone KSA DLL snapshot repository
      shell: bash
      env:
        KSA_DLL_REPOSITORY: ${{ steps.ksa-repo.outputs.repository }}
        INPUT_KSA_TOKEN: ${{ inputs.ksa_dll_token }}
        MINTED_KSA_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        mkdir -p deps deps/extracted deps/ksa
        ksa_token="${INPUT_KSA_TOKEN:-${KSA_DLL_TOKEN:-${MINTED_KSA_TOKEN:-}}}"
        if [ -z "$ksa_token" ]; then
          echo "No KSA DLL token or App credentials provided for ${KSA_DLL_REPOSITORY}." >&2
          exit 1
        fi
        git clone --depth 1 "https://x-access-token:${ksa_token}@github.com/${KSA_DLL_REPOSITORY}.git" deps/ksa-repo
        find deps/ksa-repo -maxdepth 1 -type f -exec cp {} deps/ksa/ \;
        dll_count=$(find deps/ksa -maxdepth 1 -type f -name '*.dll' | wc -l)
        if [ "$dll_count" -eq 0 ]; then
          echo "No DLL files found in root of ${KSA_DLL_REPOSITORY}." >&2
          exit 1
        fi

    - name: Collect KSA version from ksa-versions.csv
      id: ksa-version
      shell: bash
      run: |
        if [ -f "deps/ksa/ksa-versions.csv" ]; then
          ksa_version=$(awk -F',' '$1 == "KSA" { print $2; exit }' deps/ksa/ksa-versions.csv | tr -d '\r')
        elif [ -f "deps/ksa/KSA_VERSION.txt" ]; then
          ksa_version=$(tr -d '\r\n' < deps/ksa/KSA_VERSION.txt)
        else
          echo "Neither ksa-versions.csv nor KSA_VERSION.txt found in deps/ksa." >&2
          exit 1
        fi

        if [ -z "$ksa_version" ]; then
          echo "Failed to determine KSA version from deps/ksa." >&2
          exit 1
        fi
        echo "KSA version: $ksa_version"
        echo "version=$ksa_version" >> "$GITHUB_OUTPUT"

    - name: Resolve project metadata from MSBuild
      id: metadata
      shell: bash
      env:
        CSPROJ_PATH: ${{ inputs.csproj_path }}
        ARTIFACT_PREFIX_INPUT: ${{ inputs.artifact_prefix }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_SHA: ${{ github.sha }}
      run: |
        ksa_dir="$(pwd)/deps/ksa/"
        props_json=$(dotnet msbuild "$CSPROJ_PATH" -getProperty:ModName -getProperty:AssemblyName -getProperty:VersionPrefix "/p:KSADir=$ksa_dir" /p:UseKsaNuGetPackages=true)
        mod_name=$(echo "$props_json" | jq -r '.Properties.ModName')
        assembly_name=$(echo "$props_json" | jq -r '.Properties.AssemblyName')
        version_prefix=$(echo "$props_json" | jq -r '.Properties.VersionPrefix')

        if [ -z "$mod_name" ] || [ "$mod_name" = "null" ] || [ -z "$version_prefix" ] || [ "$version_prefix" = "null" ]; then
          echo "Failed to resolve ModName or VersionPrefix from $CSPROJ_PATH:" >&2
          echo "$props_json" >&2
          exit 1
        fi

        if [ -n "$ARTIFACT_PREFIX_INPUT" ]; then
          artifact_prefix="$ARTIFACT_PREFIX_INPUT"
        else
          artifact_prefix="$(basename "$CSPROJ_PATH" .csproj)"
        fi

        version="v${version_prefix}"
        echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
        echo "assembly_name=$assembly_name" >> "$GITHUB_OUTPUT"
        echo "artifact_prefix=$artifact_prefix" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

        if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        elif git diff "$EVENT_BEFORE" "$EVENT_SHA" -- "$CSPROJ_PATH" | grep -q 'VersionPrefix'; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download release dependency DLLs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GH_OWNER: ${{ github.repository_owner }}
        CONFIGURATION: ${{ steps.ksa-repo.outputs.configuration }}
        INCLUDE_STARMAP: ${{ inputs.include_starmap }}
        MOD_DEPS: ${{ inputs.mod_deps }}
      run: |
        python3 "${GITHUB_ACTION_PATH}/../scripts/download_deps.py"

    - name: Rewrite local project references for CI
      if: ${{ inputs.project_ref_replacements != '' }}
      shell: bash
      env:
        CSPROJ_PATH: ${{ inputs.csproj_path }}
        PROJECT_REF_REPLACEMENTS: ${{ inputs.project_ref_replacements }}
      run: |
        python3 "${GITHUB_ACTION_PATH}/../scripts/rewrite_project_refs.py"

    - name: Check if current version needs release
      id: release-check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        NEW_VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "release_needed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        release_response=$(curl -sS -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")

        current_version=$(echo "$release_response" | jq -r '.tag_name // empty')
        if [ -z "$current_version" ] || [ "$NEW_VERSION" != "$current_version" ]; then
          release_needed=true
        else
          release_needed=false
        fi

        echo "Current latest release: ${current_version:-none}"
        echo "New version: $NEW_VERSION"
        echo "Release needed: $release_needed"
        echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"

    - name: Restore and build mod
      shell: bash
      env:
        CSPROJ_PATH: ${{ inputs.csproj_path }}
        MOD_NAME: ${{ steps.metadata.outputs.mod_name }}
        CONFIGURATION: ${{ steps.ksa-repo.outputs.configuration }}
      run: |
        rm -rf "Release/${MOD_NAME}"
        mkdir -p "Release/${MOD_NAME}"

        deps_dir="$(pwd)/deps/"
        ksa_dir="$(pwd)/deps/ksa/"
        dotnet restore "$CSPROJ_PATH" "/p:KSADir=$ksa_dir" "/p:KSAModsDir=$deps_dir" /p:UseKsaNuGetPackages=true
        dotnet build "$CSPROJ_PATH" -c "$CONFIGURATION" --no-restore "/p:KSADir=$ksa_dir" "/p:KSAModsDir=$deps_dir" /p:UseKsaNuGetPackages=true

    - name: Run tests
      if: ${{ inputs.test_command != '' }}
      shell: bash
      env:
        CONFIGURATION: ${{ steps.ksa-repo.outputs.configuration }}
        KSADir: ${{ github.workspace }}/deps/ksa/
        KSAModsDir: ${{ github.workspace }}/deps/
        UseKsaNuGetPackages: 'true'
      run: |
        ${{ inputs.test_command }}

    - name: Compute artifact name
      id: artifact-name
      shell: bash
      env:
        PREFIX: ${{ steps.metadata.outputs.artifact_prefix }}
        VERSION: ${{ steps.metadata.outputs.version }}
        CONFIGURATION: ${{ steps.ksa-repo.outputs.configuration }}
        RELEASE_NEEDED: ${{ steps.release-check.outputs.release_needed }}
        VERSION_CHANGED: ${{ steps.metadata.outputs.changed }}
      run: |
        short_hash="${GITHUB_SHA::7}"
        if [ "$CONFIGURATION" = "Debug" ]; then
          artifact_name="${PREFIX}-${VERSION}-${short_hash}-debug"
        elif [ "$RELEASE_NEEDED" = "true" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$VERSION_CHANGED" = "true" ]; }; then
          artifact_name="${PREFIX}-${VERSION}"
        else
          artifact_name="${PREFIX}-${VERSION}-${short_hash}"
        fi
        echo "Artifact name: $artifact_name"
        echo "name=$artifact_name" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: Release/
